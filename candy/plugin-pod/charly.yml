plugin-pod:
    candy:
        description: |-
            The `charly start`/`stop`/`restart`/`config`/`shell`/`service`/`logs`/`remove`/`cp`/
            `volume` pod-lifecycle CLI — a COMMAND-class charly plugin (github.com/opencharly/sdk),
            the CLI sibling of candy/plugin-deploy-pod (which keeps deploy:pod out-of-process,
            untouched — mirroring the candy/plugin-vm / candy/plugin-deploy-vm split). Each command
            word is INDEPENDENT (no shared parent). `charly restart` is pure sdk/kit + sdk/deploykit
            logic (deploykit.RestartPodService) with zero host coupling. The registry-bound commands
            (start/stop/…) forward their authored flags, as sdk/spec wire requests, to a per-command
            HostBuild seam — the host reconstructs the original core orchestration struct and runs
            its Run() logic VERBATIM (mirroring candy/plugin-fleet's deploy-add/deploy-del seams),
            because the provider REGISTRY (ResolveTarget, the plugin loader) is a core Mechanism a
            plugin cannot import or hold. COMPILED-IN, it dispatches IN-PROC via Invoke(OpRun), so the
            handlers run in charly's own process and inherit real stdio/TTY natively. Placement of
            THIS candy is independent of candy/plugin-deploy-pod's placement.
        plugin:
            providers:
                - command:start
                - command:stop
                - command:restart
                - command:logs
                - command:remove
                - command:shell
                - command:service
                - command:volume
                - command:cp
                - command:config
                - command:update
            source: github.com/opencharly/plugin-pod/candy/plugin-pod
        plan:
            - check: the pod command plugin ships a buildable Go module (go.mod + the provider main) the host can build + serve out-of-process or compile in; the full `charly start/stop/restart/…` end-to-end is exercised by the live R10 + the Go tests
              id: pod-command-module-present
              context:
                - build
              command: "test -f go.mod && test -f plugin.go && test -f command.go && test -f pod_cmd.go"

restart-skill:
    skill:
        name: restart
        family: pod-verbs
        owner: plugin-pod
        triggers:
            - "`charly restart` / restart a deployment / cycle a container"
volume-skill:
    skill:
        name: volume
        family: pod-verbs
        owner: plugin-pod
        triggers:
            - "`charly volume` / list a deployment's volumes / reset a volume / wipe sidecar state / podman volume"
cp-skill:
    skill:
        name: cp
        family: pod-verbs
        owner: plugin-pod
        triggers:
            - "`charly cp` / copy a file into a container / copy out of a container / podman cp"

# ---------------------------------------------------------------------------
# The `charly start|stop|config|update|logs|remove|service|shell` VERB skills —
# authored beside the handlers they document.
#
# Each is a ROUTING-ONLY node: `name`/`family`/`owner` (plus `triggers:` when the
# skill generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error in
# the marketplace generator (`candy/plugin-marketplace/skillfile.go`), and
# copying a body back into the node is how a skill drifts from its own file.
#
# `owner:` names THIS candy, because this candy IS the `command:<verb>` provider
# these skills document: the `charly <verb>` command surface is plugin-pod's, not
# core's. `family: core` is the marketplace family the skills were authored
# under, kept so every existing `/charly-core:<name>` address still resolves.
# This candy composes no image — it is listed in the charly providers registry,
# never in a box's `candy:` chain — so these nodes add no entry to any
# `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
charly-config-skill:
    skill:
        name: charly-config
        family: core
        owner: plugin-pod
charly-update-skill:
    skill:
        name: charly-update
        family: core
        owner: plugin-pod
logs-skill:
    skill:
        name: logs
        family: core
        owner: plugin-pod
remove-skill:
    skill:
        name: remove
        family: core
        owner: plugin-pod
service-skill:
    skill:
        name: service
        family: core
        owner: plugin-pod
shell-skill:
    skill:
        name: shell
        family: core
        owner: plugin-pod
start-skill:
    skill:
        name: start
        family: core
        owner: plugin-pod
stop-skill:
    skill:
        name: stop
        family: core
        owner: plugin-pod
